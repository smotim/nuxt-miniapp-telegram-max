name: release

# A tag v* publishes that version to npm: `npm version patch && git push --follow-tags`.
# No token: npm trusts this workflow (trusted publishing, configured on npmjs.com
# for release.yml), and provenance links the package to this commit.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm with trusted publishing
        run: npm install -g npm@^11.5.1

      - name: The tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare
        run: pnpm dev:prepare

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm test:types

      - name: Chromium for the end-to-end tests
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Test
        run: pnpm test

      # prepack builds dist/ first.
      - name: Publish
        run: npm publish --access public
